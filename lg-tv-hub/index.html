<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stream Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse at top, #1a2030 0%, #0b0d12 70%);
    color: #f2f4f8; font-family: "LG Smart UI", "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 72px 120px 0;
  }
  h1 { font-size: 64px; font-weight: 700; letter-spacing: -1px; }
  h1 span { color: #8a93a6; font-weight: 400; }
  #clock { font-size: 56px; font-weight: 300; color: #c9cfdb; }
  #date { font-size: 28px; color: #8a93a6; text-align: right; }
  #grid {
    display: grid; grid-template-columns: repeat(4, 360px); gap: 48px;
    justify-content: center; margin-top: 96px;
  }
  .tile {
    position: relative; height: 240px; border-radius: 24px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 28px 32px; cursor: pointer;
    background: var(--bg); color: var(--fg, #fff);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transition: transform .15s ease, box-shadow .15s ease, outline-color .15s;
    outline: 6px solid transparent; outline-offset: 6px;
  }
  .tile .logo { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; }
  .tile .hint { font-size: 22px; opacity: .75; margin-top: 8px; }
  .tile .badge {
    position: absolute; top: 20px; right: 24px; font-size: 18px; font-weight: 600;
    background: rgba(0,0,0,.35); padding: 6px 14px; border-radius: 99px;
  }
  .tile.focused {
    transform: scale(1.08); outline-color: #ffffff;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  footer {
    position: absolute; bottom: 64px; left: 0; right: 0;
    text-align: center; font-size: 26px; color: #8a93a6;
  }
  footer b { color: #c9cfdb; }
  #toast {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: #232a3a; color: #fff; font-size: 30px; padding: 22px 40px;
    border-radius: 16px; opacity: 0; transition: opacity .25s; max-width: 1700px; white-space: nowrap;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>Stream Hub <span>· seus streamings</span></h1>
    <div><div id="clock">--:--</div><div id="date"></div></div>
  </header>

  <main id="grid"></main>

  <div id="toast"></div>
  <footer>Use as <b>setas</b> do controle e aperte <b>OK</b> para abrir · <b>Voltar</b> sai do app</footer>

<script>
/*
 * Cada serviço lista os IDs de app conhecidos no webOS, em ordem de tentativa.
 * O ID varia conforme a região e a versão do webOS; o hub tenta um por um até um abrir.
 * Se nenhum funcionar na sua TV, veja no README como descobrir o ID correto.
 */
var SERVICES = [
  { name: "Netflix",      bg: "#141414", fg: "#e50914", ids: ["netflix"] },
  { name: "Prime Video",  bg: "linear-gradient(135deg,#00a8e1,#0f79af)", ids: ["amazon", "com.amazon.amazonvideo.webos"] },
  { name: "Disney+",      bg: "linear-gradient(135deg,#0b1a5a,#113ccf)", ids: ["com.disney.disneyplus-prod"] },
  { name: "Paramount+",   bg: "linear-gradient(135deg,#0064ff,#0033a0)", ids: ["com.cbs-ent.paramountplus", "com.paramountplus.app", "com.cbs-all-access.app.cbs-all-access"] },
  { name: "HBO Max",      bg: "linear-gradient(135deg,#002be7,#5b2be0)", ids: ["com.wbd.stream", "com.hbo.hbomax", "com.hbo.hbonow"] },
  { name: "Crunchyroll",  bg: "linear-gradient(135deg,#f47521,#d9541e)", ids: ["crunchyroll", "com.crunchyroll.crunchyroll"] },
  { name: "Apple TV",     bg: "linear-gradient(135deg,#2b2b2e,#000)", ids: ["com.apple.appletv"] }
];

var COLS = 4;
var STORE_KEY = "streamhub.lastUsed";
var grid = document.getElementById("grid");
var tiles = [];
var focus = 0;

function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- Chamada ao serviço do sistema (Luna) ---------- */
function lunaCall(uri, params, cb) {
  if (typeof PalmServiceBridge === "undefined") {
    cb({ returnValue: false, errorText: "preview" });
    return;
  }
  var bridge = new PalmServiceBridge();
  bridge.onservicecallback = function (msg) {
    var res;
    try { res = JSON.parse(msg); } catch (e) { res = { returnValue: false, errorText: "resposta inválida" }; }
    cb(res);
  };
  bridge.call(uri, JSON.stringify(params || {}));
}

function launchService(svc) {
  var i = 0;
  showToast("Abrindo " + svc.name + "…");
  (function tryNext() {
    if (i >= svc.ids.length) {
      showToast(svc.name + " não está instalado. Instale pela LG Content Store e faça login uma vez no app oficial.", 6000);
      return;
    }
    var id = svc.ids[i++];
    lunaCall("luna://com.webos.applicationManager/launch", { id: id }, function (res) {
      if (res.returnValue) return;
      if (res.errorText === "preview") {
        showToast("Prévia no navegador: na TV, isto abriria o app " + svc.name + " (" + id + ").", 4000);
        return;
      }
      tryNext();
    });
  })();
}

/* ---------- Interface ---------- */
function render() {
  var last = storageGet(STORE_KEY);
  SERVICES.forEach(function (svc, idx) {
    var el = document.createElement("div");
    el.className = "tile";
    el.style.setProperty("--bg", svc.bg);
    if (svc.fg) el.style.setProperty("--fg", svc.fg);
    el.innerHTML =
      (svc.name === last ? '<div class="badge">Último</div>' : "") +
      '<div class="logo"></div><div class="hint">Abrir</div>';
    el.querySelector(".logo").textContent = svc.name;
    el.addEventListener("mouseenter", function () { setFocus(idx); });
    el.addEventListener("click", function () { activate(idx); });
    grid.appendChild(el);
    tiles.push(el);
    if (svc.name === last) focus = idx;
  });
  setFocus(focus);
}

function setFocus(idx) {
  if (idx < 0 || idx >= tiles.length) return;
  tiles[focus].classList.remove("focused");
  focus = idx;
  tiles[focus].classList.add("focused");
}

function activate(idx) {
  var svc = SERVICES[idx];
  storageSet(STORE_KEY, svc.name);
  launchService(svc);
}

var toastTimer;
function showToast(text, ms) {
  var t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, ms || 2500);
}

document.addEventListener("keydown", function (e) {
  switch (e.keyCode) {
    case 37: setFocus(focus - 1); break;                                   // esquerda
    case 39: setFocus(focus + 1); break;                                   // direita
    case 38: setFocus(focus - COLS); break;                                // cima
    case 40: setFocus(Math.min(focus + COLS, tiles.length - 1)); break;    // baixo
    case 13: activate(focus); break;                                       // OK
    case 461:                                                              // Voltar (controle LG)
    case 8:
      if (window.webOSSystem && webOSSystem.platformBack) webOSSystem.platformBack();
      else window.close();
      break;
    default: return;
  }
  e.preventDefault();
});

function tick() {
  var d = new Date();
  document.getElementById("clock").textContent =
    ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  document.getElementById("date").textContent =
    d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
}

render();
tick();
setInterval(tick, 10000);
</script>
</body>
</html>
